name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skipped on the release PR and release commit: they only change versions and changelogs, and the release reuses the parent's image
  test:
    if: >-
      github.head_ref != 'release-please--branches--main'
      && !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Same skip as test; image is skipped with them through needs
  sast:
    if: >-
      github.head_ref != 'release-please--branches--main'
      && !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --error fails the job on any finding; --severity ERROR limits findings to the highest-severity rules
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/javascript --config p/nodejsscan
          --severity ERROR --error --metrics=off
          --sarif-output=semgrep.sarif

      # Runs even when the scan fails, so findings still reach the Security tab
      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif

  helm:
    runs-on: ubuntu-latest
    container: quay.io/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    defaults:
      run:
        shell: bash
    steps:
      # Full history so ct can diff against main to find changed charts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The container runs as a different user than the checkout owner; git refuses such repos by default
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Lints each chart/ci/*-values.yaml. Version bump check is off: release-please bumps the chart in its release PR
      - name: Chart lint (ct)
        run: ct lint --chart-dirs . --target-branch main --validate-maintainers=false --check-version-increment=false

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform

      # Second schema location covers CRDs such as ServiceMonitor
      - name: Validate rendered manifests (kubeconform)
        run: |
          for f in chart/ci/*-values.yaml; do
            echo "== $f"
            helm template ci chart -f "$f" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  # Builds, tests, scans and (on main only) pushes the image in one job: the image exists only on this runner
  image:
    needs: [test, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    env:
      IMAGE: sample-app:${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Integration test
        run: scripts/integration-test.sh "$IMAGE"

      # Docker socket lets Trivy read the local image; the cache mount reuses the vulnerability DB between the two scans
      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" image
          --severity HIGH,CRITICAL --exit-code 1
          "$IMAGE"

      # Runs even when the scan fails, so findings still reach the Security tab
      - name: Trivy SARIF report
        if: success() || failure()
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          -v "$PWD:/out"
          "$TRIVY_IMAGE" image
          --severity HIGH,CRITICAL --format sarif --output /out/trivy.sarif
          "$IMAGE"

      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Push only after a merge to main; the IAM role trusts only this repo's main branch
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          registry="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag "$IMAGE" "$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"

  # Opens/updates the release PR on each merge; creates tags and GitHub Releases when the release PR is merged.
  # Runs only after every gate passed, so the release PR only lists commits whose image is in ECR.
  # Skipped is allowed (release commit skips test/sast/image), so each gate is listed directly to catch failures.
  release:
    needs: [test, sast, image, helm]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two quick merges must not update the release PR at the same time
    concurrency: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Empty unless that package was released in this run
    outputs:
      app_version: ${{ steps.release.outputs.version }}
      chart_tag: ${{ steps.release.outputs['chart--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # The steps below run only on an app release (outputs without a path prefix belong to the "." package)
      - name: Configure AWS credentials
        if: steps.release.outputs.release_created == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Adds the version tag to the parent commit's image, built and tested when it merged: same manifest, same digest, no rebuild
      - name: Tag release image in ECR
        if: steps.release.outputs.release_created == 'true'
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VERSION: ${{ steps.release.outputs.version }}
          # main before this push; with squash merge, the release commit's parent
          PARENT_SHA: ${{ github.event.before }}
        run: |
          repo="${ECR_REPOSITORY#*/}"
          manifest=$(aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag="$PARENT_SHA" --query 'images[0].imageManifest' --output text)
          # batch-get-image reports a missing image as "None" instead of failing
          if [ "$manifest" = "None" ]; then
            echo "Image $repo:$PARENT_SHA not found"
            exit 1
          fi
          media=$(aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag="$PARENT_SHA" --query 'images[0].imageManifestMediaType' --output text)
          aws ecr put-image --repository-name "$repo" --image-tag "$VERSION" --image-manifest "$manifest" --image-manifest-media-type "$media"

  # Commits the released versions to eks-gitops; Argo CD deploys from there. That commit is the deploy; reverting it is the rollback.
  update-gitops:
    needs: [release]
    if: needs.release.outputs.app_version != '' || needs.release.outputs.chart_tag != ''
    runs-on: ubuntu-latest
    # Serializes pushes to eks-gitops across runs
    concurrency: eks-gitops
    # GITHUB_TOKEN is not used; access to eks-gitops comes from the GitHub App token
    permissions: {}
    steps:
      # Short-lived token for the App, which is installed on eks-gitops only
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: eks-gitops

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/eks-gitops
          token: ${{ steps.token.outputs.token }}

      # Quoted tag so a version like 1.10 is never read as a number
      - name: Update pins
        env:
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          CHART_TAG: ${{ needs.release.outputs.chart_tag }}
        run: |
          if [ -n "$APP_VERSION" ]; then
            yq -i '.image.tag = strenv(APP_VERSION) | .image.tag style="double"' workloads/apps/sample-app/values.yaml
          fi
          if [ -n "$CHART_TAG" ]; then
            yq -i '(.spec.sources[] | select(.path == "chart")).targetRevision = strenv(CHART_TAG)' bootstrap/apps/sample-app.yaml
          fi

      # One commit for both pins, so they deploy and revert together
      - name: Commit and push
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          CHART_TAG: ${{ needs.release.outputs.chart_tag }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pins already up to date"
            exit 0
          fi
          git commit -m "chore(sample-app): deploy app ${APP_VERSION:-unchanged}, chart ${CHART_TAG:-unchanged}" \
            -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git pull --rebase
          git push
