name: PR title

# Separate from CI: "edited" (a title fix) must re-run this check without re-running the whole pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # Squash merge makes the PR title the commit message release-please reads, so it must be a Conventional Commit
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
