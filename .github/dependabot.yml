version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release; security updates are not delayed
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A new base image changes what runs, so the PR title is "fix(deps): ..." and release-please makes a patch release
    commit-message:
      prefix: fix
      include: scope
